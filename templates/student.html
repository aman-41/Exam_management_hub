<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

</head>
<body>
    <h1>Registered Students</h1>
    <form action="/search_student" method="POST">
    <input type="text" name="search" placeholder="Search by Id or Name">
    <button type="submit" class="btn btn-danger">Search</button>
    </form>
    <table class="table">
        <tr>
            <th>Student Name</th>
            <th>Student Id</th>
            <th>Contact No</th>
            <th>Email Id</th>
            <th>Action</th>
        </tr>
        {% for i in student %}
        <tr>
            <td>{{i.name}}</td>
            <td>{{i.id}}</td>
            <td>{{i.contact_no}}</td>
            <td>{{i.email_id}}</td>
            <td><a href="/view_booked_slot/{{i.id}}"><button class="btn btn-danger" >View Booked Slots</button></a></td>
        </tr>
        {% endfor %}
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyM" crossorigin="anonymous"></script>
    

</body>
</html>
