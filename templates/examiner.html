<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examiner Dashboard</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <h3>Examiner</h3>
    <a href="/create_examiner"><button class="btn btn-danger">Create Exam</button></a>
    <form action="/search_examiner" method="POST">
    <input type="text" name="search" placeholder="Search by Name">
    <button type="submit" class="btn btn-danger">Search</button>
    <table class="table">
  <thead>
    <tr>
      <th scope="col">Examiner Id</th>
      <th scope="col"> Name</th>
      <th scope="col">Department</th>
      <th scope="col">Contact No.</th>
      <th scope="col">Email Id</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    
    </tr>
  </thead>
  <tbody>
    {% for i in examiner%}
    <tr>
      <th> {{i.id}}</th>
      <td>{{i.name}}</td>
      <td>{{i.department}}</td>
      <td>{{i.contact_no}}</td>
      <td>{{i.email_id}}</td>
      <td>{{i.status}}</td>
      <td><button><a href = "/approve_examiner/{{i.id}}">Approve</a></button>
      <button><a href = "/deactivate_examiner/{{i.id}}">Deactivate</a></button>
      </td>
    </tr>
{% endfor %}
    
  </tbody>
</table>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
