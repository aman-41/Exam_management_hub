<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Rubrics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <h2>Assign Rubrics to Examination: {{examination.name}}</h2>
    <form method="POST">
        
    <label for="criteria">Criterion</label>
    <input type="text" id="criteria" name ="criterion"   required >
    <label for="maximum_marks">Max Marks</label>
    <input type="number" id="maximum_marks" name ="maximum_marks" required>
    <label for="weightage">Weightage</label>
    <input type="number" id="weightage" name ="weightage" required>
    <label for="remark">Remarks</label>
    <input type="text" id="remark" name ="remark" required>

    <button type="submit"> Assign Rubrics </button>
  

    </form>
    <td><button><a href = "/view_rubrics/{{examination.id}}">View Rubrics</a></button></td>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyM    
</body>
</html>
