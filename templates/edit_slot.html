<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Edit Slot</h1>
    <form action="/edit_slot/{{examination_slot.id}}" method="POST">
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{examination_slot.date}}" required><br><br>

        <label for="start_time">Start Time:</label>
        <input type="time" id="start_time" name="start_time" value="{{examination_slot.start_time}}" required><br><br>

        <label for="end_time">End Time:</label>
        <input type="time" id="end_time" name="end_time" value="{{examination_slot.end_time}}" required><br><br>

        <label for="maximum_slots">Maximum Slots:</label>
        <input type="number" id="maximum_slots" name="maximum_slots" value="{{examination_slot.maximum_slots}}" required><br><br>

        <button type="submit">Update Slot</button>
    </form>
    
</body>
</html>
