<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Exam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <h3>You can edit examination here</h3>
      <form action="/edit_examination/{{examination.id}}" method="POST">

 <div class="form-group">
    <label for="exampleInputEmail1">Examination Name</label>
    <input type="text" class="form-control" name="name" aria-describedby="emailHelp" value="{{examination.name}}">
    <small id="emailHelp" class="form-text text-muted"></small>
  </div>
  <div class="form-group">
    <label for="exampleInputEmail1">Examination Id</label>
    <input type="text" class="form-control" name="id" aria-describedby="emailHelp" value="{{examination.id}}">
    <small id="emailHelp" class="form-text text-muted"></small>
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1"> Duration</label>
    <input type="text" class="form-control" name ="duration" value="{{examination.duration}}">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Examination Type</label>
    <input type="text" class="form-control" name ="type" value="{{examination.type}}">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Slot Start Date</label>
    <input type="date" class="form-control" name ="slot_open_date" value="{{examination.slot_open_date}}">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Slot End Date</label>
    <input type="date" class="form-control" name ="slot_close_date" value="{{examination.slot_close_date}}">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Booking Start Date</label>
    <input type="date" class="form-control" name ="booking_open_date" value="{{examination.booking_open_date}}">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Booking End Date</label>
    <input type="date" class="form-control" name ="booking_close_date" value="{{examination.booking_close_date}}">
  </div>
  <div>
  <label for="exampleInputEmail1">Status</label>
    <select name = "status" value = "{{examination.status}}">
      <option value = 'draft'>Draft</option>
      <option value = 'slot creation'>Slot Creation</option>
      <option value = 'booking open'>Booking Open</option>
      <option value = 'closed'>Closed</option>
      <option value = 'completed'>Completed</option>
    </select>
  </div>
  <div class="form-group">
    <label>Course ID</label>
    <input type="text" class="form-control"
           value="{{examination.course_id}}" readonly>
</div>

  
  <button type="submit" class="btn btn-primary">Edit</button>
</form>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyM"crossorigin="anonymous"></script>
    
</body>
</html>
