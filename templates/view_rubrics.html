<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Rubrics for Examination: {{examination.name}}</h1>
    <table border="2">
        <tr>
            <th>Criterion</th>
            <th>Maximum Marks</th>
            <th>Weightage</th>
            <th>Description</th>
        </tr>
        {% for rubric in examination_rubric %}
        <tr>
            <td>{{rubric.criterion}}</td>
            <td>{{rubric.maximum_marks}}</td>
            <td>{{rubric.weightage}}</td>
            <td>{{rubric.remark}}</td>
        </tr>
        {% endfor %}
</body>
</html>
