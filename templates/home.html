<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

    <h2>Register</h2>
  <form action="/register" method="post">
    <label for="exampleInputEmail1">Usertype</label>
    <select name = "usertype" id="usertype">
      <option value = 'Examiner'>Examiner</option>
      <option value = 'Student'>Student</option>
    </select>
 <div class="form-group">
    <label for="exampleInputEmail1">Registeration Id</label>
    <input type="text" class="form-control" name="id" aria-describedby="emailHelp" placeholder="Id">
    <small id="emailHelp" class="form-text text-muted"></small>
  </div>
    <div class="form-group">
    <label for="exampleInputEmail1">Full Name</label>
    <input type="text" class="form-control" name="name" aria-describedby="emailHelp" placeholder="Full Name">
    <small id="emailHelp" class="form-text text-muted"></small>
  </div>
  <div class="form-group">
    <label for="exampleInputEmail1">Username</label>
    <input type="text" class="form-control" name="username" aria-describedby="emailHelp" placeholder="Username">
    <small id="emailHelp" class="form-text text-muted"></small>
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Password</label>
    <input type="password" class="form-control" name ="password" placeholder="Password">
  </div>
  <div class="form-group" id = "department">
    <label for="exampleInputPassword1">Department</label>
    <input type="text" class="form-control" name="department" aria-describedby="emailHelp" placeholder="Department">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Email</label>
    <input type="text" class="form-control" name="email_id" aria-describedby="emailHelp" placeholder="Email">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Contact No</label>
    <input type="text" class="form-control" name="contact_no" aria-describedby="emailHelp" placeholder="Contact No.">
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
<script>
    document.getElementById("usertype").onchange = function() {
        document.getElementById("department").style.display =
            this.value == "Student" ? "none" : "block";
    };
</script>
</body>
</html>
