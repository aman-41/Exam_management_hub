<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

<body>

    <a href="/examiner"><button class="btn btn-danger">Examiner</button></a>
    <a href="/student"><button class="btn btn-danger">Student</button></a>
    <a href="/logout"><button class="btn btn-danger">Logout</button></a>
    <h4>Total No. of Course : {{total_course}}</h4>

    <h4>Total No. of Examiner : {{total_examiner}}</h4>
    <h4>Total No. of Student : {{total_student}}</h4>
    <h4>Total No. of Examination Slot : {{total_slots}}</h4>
    <h4>Total No. of Bookings : {{total_booking}}</h4>
    
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
