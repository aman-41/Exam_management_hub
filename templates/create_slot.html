<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Slot</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>
    <h2>Create slot for {{examination.name}}</h2>
    <form method = "POST">
    <label for="date">Date</label>
    <input type="date" id="date" name ="date"  required >

    <label for="start_time">Start Time</label>
    <input type="time" id="start_time" name ="start_time" required>

    <label for="end_time">End Time</label>
    <input type="time" id="end_time" name ="end_time" required>

    <label for="maximum_slots">Maximum Slots</label>
    <input type="text" id="maximum_slots" name ="maximum_slots" required >

    <label for="status">Status</label>
    <select id = "status" name = "status" required> 
        <option value="available">Available</option>
        <option value="booked">Booked</option>
    </select>
<input type="submit" value="Create Slot">
    </form>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyM" crossorigin="anonymous"></script>

</body>
</html>
